<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>原稿图集｜ZY研究室</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f8;color:#20354b;font:15px/1.7 system-ui,-apple-system,"Microsoft YaHei",sans-serif}header{background:linear-gradient(120deg,#081b2d,#16354d);color:#e5edf6;padding:30px max(20px,calc((100vw - 1400px)/2)) 35px}a{color:inherit}header a{text-decoration:none;font-size:13px;color:#aec3d5}header small{display:block;color:#c4a16a;letter-spacing:.15em;margin-top:25px}h1{font-size:clamp(25px,4vw,39px);font-weight:600;margin:8px 0}header p{color:#9db3c8;max-width:800px;margin:8px 0}main{max-width:1450px;margin:auto;padding:24px}.filters{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:20px;position:sticky;top:0;background:#f2f5f8ee;backdrop-filter:blur(10px);padding:12px 0;z-index:1}input,select,button{font:inherit}input,select{padding:11px 14px;border:1px solid #ccd7e1;border-radius:7px;background:white;color:#20354b;max-width:100%}input{min-width:250px;flex:1}#count{font-size:12px;color:#687d91}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(275px,1fr));gap:18px}.card{background:white;border:1px solid #dbe3eb;border-radius:10px;overflow:hidden;box-shadow:0 5px 15px #152f4610}.card button{width:100%;padding:0;border:0;background:#e8edf3;cursor:zoom-in;display:block}.card img{display:block;width:100%;height:235px;object-fit:contain}.caption{padding:15px 17px}.caption small{display:block;color:#9d7b49;font-size:10px;letter-spacing:.05em}.caption strong{font-weight:550;display:block;margin:5px 0}.caption span{display:block;font-size:11px;color:#8190a0}.empty{text-align:center;grid-column:1/-1;padding:60px}dialog{border:1px solid #33516a;border-radius:12px;background:#0d2337;color:#dbe7f4;max-width:calc(100vw - 22px);width:min(1400px,95vw);max-height:95dvh;padding:14px;overflow-x:hidden}dialog::backdrop{background:#03111de8;backdrop-filter:blur(8px)}dialog img{display:block;max-width:100%;max-height:76dvh;object-fit:contain;margin:10px auto}dialog .bar{display:flex;align-items:center;gap:12px}dialog .bar span{flex:1;font-size:12px}dialog button{background:#203e56;color:white;border:1px solid #3b566e;border-radius:6px;padding:8px 12px;cursor:pointer}dialog p{font-size:12px;text-align:center;color:#a4bdd2}footer{padding:35px 24px;text-align:center;font-size:12px;color:#7c8fa1}button:focus-visible,a:focus-visible{outline:2px solid #b69560;outline-offset:4px}@media(max-width:600px){main{padding:12px}.filters{gap:8px}input,select{width:100%;font-size:16px}.grid{grid-template-columns:1fr}.card img{height:260px}header{padding:20px 18px 26px}header p{font-size:12px}}
</style></head><body><header><a href="/research/handbook/">← 科技产业链投资手册</a><small>ZY RESEARCH · ORIGINAL FIGURE ARCHIVE</small><h1>把原稿里的图，完整留下来。</h1><p>《科技十日谈》本地保存版的 208 处配图，按原章节顺序恢复。所有图片由原文件提取，保留章节上下文；点图放大。</p><p>这是底稿图集，和手册正文分开展示。图中文字、公司数据与判断保留原稿口径，不代表最新行情或本次重新核验的结论。</p></header><main><div class="filters"><input id="query" type="search" placeholder="搜索原稿章节或图版所在小节" aria-label="搜索原稿图版"><select id="chapter" aria-label="按原稿章节筛选"><option value="">全部原稿章节</option></select><span id="count" role="status">正在读取图集…</span></div><div id="grid" class="grid"></div></main><footer>来源：用户提供的《科技十日谈》本地保存版 · 原文件保留 · 配图经尺寸优化，未重新绘制</footer><dialog id="viewer" aria-label="原稿配图放大"><div class="bar"><button id="previous" aria-label="上一张图片">←</button><span id="position"></span><button id="next" aria-label="下一张图片">→</button><button id="close" aria-label="关闭大图">关闭 ×</button></div><img id="large" alt=""><p id="description"></p></dialog><script>
const grid=document.getElementById('grid'),query=document.getElementById('query'),filter=document.getElementById('chapter'),count=document.getElementById('count'),dialog=document.getElementById('viewer');let images=[],visible=[],active=0;
function show(i){active=(i+visible.length)%visible.length;const row=visible[active],img=document.getElementById('large');img.src=row.src;img.alt=row.chapter+' · '+row.section;document.getElementById('description').textContent=row.chapter+' / '+row.section+' · 原稿第 '+row.id+' 图';document.getElementById('position').textContent=(active+1)+' / '+visible.length;if(!dialog.open)dialog.showModal();}
function render(){const term=query.value.trim().toLowerCase();visible=images.filter(r=>(!filter.value||r.chapter===filter.value)&&(!term||(r.chapter+' '+r.section).toLowerCase().includes(term)));grid.replaceChildren();count.textContent=visible.length+' / '+images.length+' 处图版';if(!visible.length){const p=document.createElement('p');p.className='empty';p.textContent='没有找到对应图版，试试原稿章节名称。';grid.append(p);return;}for(const [i,row]of visible.entries()){const card=document.createElement('article');card.className='card';const button=document.createElement('button');button.setAttribute('aria-label','放大原稿第 '+row.id+' 图 · '+row.section);button.onclick=()=>show(i);const image=document.createElement('img');image.src=row.src;image.alt=row.chapter+' · '+row.section;image.width=row.width;image.height=row.height;image.loading='lazy';button.append(image);const caption=document.createElement('div');caption.className='caption';const chapter=document.createElement('small');chapter.textContent=row.chapter;const title=document.createElement('strong');title.textContent=row.section;const number=document.createElement('span');number.textContent='原稿图版 '+String(row.id).padStart(3,'0')+' · 点击放大';caption.append(chapter,title,number);card.append(button,caption);grid.append(card);}}
query.value=new URLSearchParams(location.search).get('q')??'';query.oninput=render;filter.onchange=render;document.getElementById('close').onclick=()=>dialog.close();document.getElementById('previous').onclick=()=>show(active-1);document.getElementById('next').onclick=()=>show(active+1);dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close();});dialog.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')show(active-1);if(e.key==='ArrowRight')show(active+1);});fetch('./index.json').then(r=>{if(!r.ok)throw Error('load');return r.json();}).then(d=>{images=d.images;for(const name of new Set(images.map(r=>r.chapter))){const option=document.createElement('option');option.value=name;option.textContent=name;filter.append(option);}const selected=images.find(row=>row.id===Number(new URLSearchParams(location.search).get('image')));if(selected){query.value='';filter.value=selected.chapter;}render();if(selected)show(visible.findIndex(row=>row.id===selected.id));}).catch(()=>{count.textContent='图集暂时无法加载，请刷新重试。';});
</script></body></html>
