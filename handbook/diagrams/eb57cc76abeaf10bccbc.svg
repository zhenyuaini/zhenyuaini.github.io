<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640" role="img" aria-labelledby="title desc"><title id="title">内存与存储：一份数据放在哪一层？</title><desc id="desc">按功能分层示意 · 不使用未经核实的延迟或价格倍数</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><rect width="720" height="640" rx="18" fill="#f7fafc"/><path d="M32 90H688" stroke="#dce5ed"/><text x="32" y="40" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="27" fill="#102b44" font-weight="600" text-anchor="start">内存与存储：一份数据放在哪一层？</text><text x="32" y="69" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#526b80" font-weight="400" text-anchor="start">按功能分层示意 · 不使用未经核实的延迟或价格倍数</text><rect x="43" y="125" width="634" height="86" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="43" y="125" width="5" height="86" rx="2" fill="#3264c8" stroke="#3264c8"/><text x="61" y="160" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">HBM</text><text x="61" y="191" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">部分加速器旁的高带宽 DRAM</text><rect x="43" y="230" width="634" height="86" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="43" y="230" width="5" height="86" rx="2" fill="#137b87" stroke="#137b87"/><text x="61" y="265" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="start">主机 DRAM</text><text x="61" y="296" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">CPU 侧运行时工作空间</text><rect x="43" y="335" width="634" height="86" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="43" y="335" width="5" height="86" rx="2" fill="#b58438" stroke="#b58438"/><text x="61" y="370" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#b58438" font-weight="600" text-anchor="start">SSD / NAND</text><text x="61" y="401" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">训练集、检查点与日志的持久保存</text><rect x="43" y="440" width="634" height="86" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="43" y="440" width="5" height="86" rx="2" fill="#526b80" stroke="#526b80"/><text x="61" y="475" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#526b80" font-weight="600" text-anchor="start">NOR Flash</text><text x="61" y="506" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">设备启动代码等非易失性存储</text><rect x="32" y="534" width="656" height="74" rx="8" fill="#edf3f8" stroke="#edf3f8"/><text x="47" y="558" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">HBM 属于 DRAM；NAND 与 NOR 是不同类别的闪存。</text><text x="47" y="585" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">容量、模组条数和接口芯片颗数，必须按各自物料表统计。</text></svg>