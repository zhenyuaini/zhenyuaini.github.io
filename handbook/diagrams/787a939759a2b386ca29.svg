<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620" role="img" aria-labelledby="title desc"><title id="title">PCB 叠层：铜线、介质和孔分别做什么？</title><desc id="desc">简化剖面 · 仅解释连接关系，不代表具体层数或设计规则</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><rect width="720" height="620" rx="18" fill="#f7fafc"/><path d="M32 90H688" stroke="#dce5ed"/><text x="32" y="40" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="27" fill="#102b44" font-weight="600" text-anchor="start">PCB 叠层：铜线、介质和孔分别做什么？</text><text x="32" y="69" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#526b80" font-weight="400" text-anchor="start">简化剖面 · 仅解释连接关系，不代表具体层数或设计规则</text><rect x="56" y="158" width="419" height="27" rx="2" fill="#b58438" stroke="#b58438"/><rect x="105" y="158" width="22" height="27" rx="0" fill="#f7fafc" stroke="#f7fafc"/><rect x="250" y="158" width="22" height="27" rx="0" fill="#f7fafc" stroke="#f7fafc"/><rect x="390" y="158" width="22" height="27" rx="0" fill="#f7fafc" stroke="#f7fafc"/><rect x="56" y="197" width="419" height="27" rx="2" fill="#b6d4cf" stroke="#b6d4cf"/><rect x="56" y="236" width="419" height="27" rx="2" fill="#b58438" stroke="#b58438"/><rect x="105" y="236" width="22" height="27" rx="0" fill="#f7fafc" stroke="#f7fafc"/><rect x="250" y="236" width="22" height="27" rx="0" fill="#f7fafc" stroke="#f7fafc"/><rect x="390" y="236" width="22" height="27" rx="0" fill="#f7fafc" stroke="#f7fafc"/><rect x="56" y="275" width="419" height="27" rx="2" fill="#b6d4cf" stroke="#b6d4cf"/><rect x="56" y="314" width="419" height="27" rx="2" fill="#b58438" stroke="#b58438"/><rect x="105" y="314" width="22" height="27" rx="0" fill="#f7fafc" stroke="#f7fafc"/><rect x="250" y="314" width="22" height="27" rx="0" fill="#f7fafc" stroke="#f7fafc"/><rect x="390" y="314" width="22" height="27" rx="0" fill="#f7fafc" stroke="#f7fafc"/><rect x="56" y="353" width="419" height="27" rx="2" fill="#b6d4cf" stroke="#b6d4cf"/><rect x="56" y="392" width="419" height="27" rx="2" fill="#b58438" stroke="#b58438"/><rect x="105" y="392" width="22" height="27" rx="0" fill="#f7fafc" stroke="#f7fafc"/><rect x="250" y="392" width="22" height="27" rx="0" fill="#f7fafc" stroke="#f7fafc"/><rect x="390" y="392" width="22" height="27" rx="0" fill="#f7fafc" stroke="#f7fafc"/><rect x="182" y="156" width="24" height="264" rx="0" fill="#f7fafc" stroke="#b58438"/><path d="M182 156 L182 420" fill="none" stroke="#b58438" stroke-width="5"/><path d="M206 156 L206 420" fill="none" stroke="#b58438" stroke-width="5"/><text x="506" y="180" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#b58438" font-weight="600" text-anchor="start">铜线路层</text><path d="M478 171 L497 171" fill="none" stroke="#b58438" stroke-width="2"/><text x="506" y="220" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="start">绝缘介质</text><path d="M478 210 L497 210" fill="none" stroke="#137b87" stroke-width="2"/><text x="506" y="331" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#102b44" font-weight="600" text-anchor="start">金属化孔</text><path d="M211 290 L492 320" fill="none" stroke="#526b80" stroke-width="2"/><text x="56" y="467" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="22" fill="#102b44" font-weight="400" text-anchor="start">覆铜板是材料；PCB 还要加工线路与层间连接。</text><rect x="32" y="514" width="656" height="74" rx="8" fill="#edf3f8" stroke="#edf3f8"/><text x="47" y="538" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">铜层数不等于芯板张数；用料要核对叠层、面积和利用率。</text><text x="47" y="565" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">高层数增加制造难度，良率和成本决定升级能留下多少毛利。</text></svg>