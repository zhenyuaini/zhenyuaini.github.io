<svg xmlns="http://www.w3.org/2000/svg" width="720" height="523" viewBox="0 0 720 523" role="img" aria-labelledby="title desc"><title id="title">资本开支怎样传到供应商？</title><desc id="desc">先确认能用的机柜，再看物料表与实际交付</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><rect width="720" height="523" rx="18" fill="#f7fafc"/><path d="M32 90H688" stroke="#dce5ed"/><text x="32" y="40" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="27" fill="#102b44" font-weight="600" text-anchor="start">资本开支怎样传到供应商？</text><text x="32" y="69" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#526b80" font-weight="400" text-anchor="start">先确认能用的机柜，再看物料表与实际交付</text><rect x="32" y="115" width="656" height="84" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="32" y="115" width="5" height="84" rx="2" fill="#3264c8" stroke="#3264c8"/><text x="50" y="150" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">预算与项目</text><text x="50" y="181" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">看客户签约、政策许可和通电排程</text><path d="M360 200 L360 215" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="218" width="656" height="84" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="32" y="218" width="5" height="84" rx="2" fill="#3264c8" stroke="#3264c8"/><text x="50" y="253" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">机柜选型</text><text x="50" y="284" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">决定装多少芯片、哪种封装、哪些端口用光</text><path d="M360 303 L360 318" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="321" width="656" height="84" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="32" y="321" width="5" height="84" rx="2" fill="#137b87" stroke="#137b87"/><text x="50" y="356" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="start">部件采购与交付</text><text x="50" y="387" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">GPU、HBM、PCB 和光器件分别看合格出货</text><rect x="32" y="444" width="656" height="47" rx="8" fill="#edf3f8" stroke="#edf3f8"/><text x="47" y="468" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">预算、采购、交付和收入是四个不同时间点。</text></svg>