<svg xmlns="http://www.w3.org/2000/svg" width="720" height="565" viewBox="0 0 720 565" role="img" aria-labelledby="title desc"><title id="title">增长很好，为什么仍可能低于预期？</title><desc id="desc">虚构教学公司 · 与正文同口径，不表示真实公司预测</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><rect width="720" height="565" rx="18" fill="#f7fafc"/><path d="M32 90H688" stroke="#dce5ed"/><text x="32" y="40" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="27" fill="#102b44" font-weight="600" text-anchor="start">增长很好，为什么仍可能低于预期？</text><text x="32" y="69" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#526b80" font-weight="400" text-anchor="start">虚构教学公司 · 与正文同口径，不表示真实公司预测</text><rect x="32" y="117" width="656" height="88" rx="10" fill="#fff" stroke="#d3e0ea"/><text x="48" y="150" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">市场原假设</text><text x="48" y="182" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#526b80" font-weight="400" text-anchor="start">收入 180 亿元 × 净利率 20%</text><text x="667" y="151" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="end">利润 36 亿</text><rect x="32" y="222" width="656" height="88" rx="10" fill="#fff" stroke="#d3e0ea"/><text x="48" y="255" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">较低增长情景</text><text x="48" y="287" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#526b80" font-weight="400" text-anchor="start">收入 150 亿元 × 净利率 15%</text><text x="667" y="256" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="end">利润 22.5 亿</text><rect x="32" y="327" width="656" height="88" rx="10" fill="#fff" stroke="#d3e0ea"/><text x="48" y="360" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">利润差额</text><text x="48" y="392" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#526b80" font-weight="400" text-anchor="start">两种增长和利润率共同作用</text><text x="667" y="361" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="end">−13.5 亿</text><rect x="32" y="486" width="656" height="47" rx="8" fill="#edf3f8" stroke="#edf3f8"/><text x="47" y="510" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">股价还受利率、风险偏好与持续性影响，不与利润差一一对应。</text></svg>