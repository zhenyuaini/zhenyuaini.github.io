<svg xmlns="http://www.w3.org/2000/svg" width="720" height="590" viewBox="0 0 720 590" role="img" aria-labelledby="title desc"><title id="title">同一座集群，六个业务边界</title><desc id="desc">业务位置分组 · 不把未披露的客户关系画成确定供货</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><rect width="720" height="590" rx="18" fill="#f7fafc"/><path d="M32 90H688" stroke="#dce5ed"/><text x="32" y="40" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="27" fill="#102b44" font-weight="600" text-anchor="start">同一座集群，六个业务边界</text><text x="32" y="69" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#526b80" font-weight="400" text-anchor="start">业务位置分组 · 不把未披露的客户关系画成确定供货</text><rect x="32" y="116" width="312" height="92" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="32" y="116" width="5" height="92" rx="2" fill="#3264c8" stroke="#3264c8"/><text x="50" y="151" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">计算平台</text><text x="50" y="182" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">GPU / 自研加速器</text><rect x="376" y="116" width="312" height="92" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="376" y="116" width="5" height="92" rx="2" fill="#137b87" stroke="#137b87"/><text x="394" y="151" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="start">封装与存储</text><text x="394" y="182" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">HBM、封装与测试</text><rect x="32" y="238" width="312" height="92" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="32" y="238" width="5" height="92" rx="2" fill="#3264c8" stroke="#3264c8"/><text x="50" y="273" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">计算与交换板</text><text x="50" y="304" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">PCB、板材及板上元件</text><rect x="376" y="238" width="312" height="92" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="376" y="238" width="5" height="92" rx="2" fill="#137b87" stroke="#137b87"/><text x="394" y="273" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="start">网络连接</text><text x="394" y="304" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">交换设备、光模块或铜缆</text><rect x="32" y="360" width="312" height="92" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="32" y="360" width="5" height="92" rx="2" fill="#3264c8" stroke="#3264c8"/><text x="50" y="395" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">电力与热管理</text><text x="50" y="426" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">园区、机柜与板级设备</text><rect x="376" y="360" width="312" height="92" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="376" y="360" width="5" height="92" rx="2" fill="#137b87" stroke="#137b87"/><text x="394" y="395" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="start">整柜验收与计费</text><text x="394" y="426" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">能交付、能运行、有人付费</text><rect x="32" y="511" width="656" height="47" rx="8" fill="#edf3f8" stroke="#edf3f8"/><text x="47" y="535" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">各清单由不同配置驱动；上游料件与含料整机收入不能简单相加。</text></svg>