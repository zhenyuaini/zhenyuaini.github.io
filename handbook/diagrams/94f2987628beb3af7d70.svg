<svg xmlns="http://www.w3.org/2000/svg" width="720" height="524" viewBox="0 0 720 524" role="img" aria-labelledby="title desc"><title id="title">A 股与 H 股怎样合成市值？</title><desc id="desc">胜宏科技 · 2026-11-20 收盘 · 按 10 月末股本扣除库存股</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><rect width="720" height="524" rx="18" fill="#f7fafc"/><path d="M32 90H688" stroke="#dce5ed"/><text x="32" y="40" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="27" fill="#102b44" font-weight="600" text-anchor="start">A 股与 H 股怎样合成市值？</text><text x="32" y="69" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#526b80" font-weight="400" text-anchor="start">胜宏科技 · 2026-11-20 收盘 · 按 10 月末股本扣除库存股</text><rect x="32" y="115" width="315" height="94" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="32" y="115" width="5" height="94" rx="2" fill="#3264c8" stroke="#3264c8"/><text x="50" y="150" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">A 股市值</text><text x="50" y="181" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">108.22 元 × 8.7234 亿股</text><rect x="373" y="115" width="315" height="94" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="373" y="115" width="5" height="94" rx="2" fill="#137b87" stroke="#137b87"/><text x="391" y="150" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="start">H 股换算人民币</text><text x="391" y="181" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">86.75 港元 × 1.1023 亿股</text><text x="530" y="235" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#526b80" font-weight="400" text-anchor="middle">再乘 0.85618 元 / 港元</text><path d="M192 222 L192 270" fill="none" stroke="#3264c8" stroke-width="2" marker-end="url(#arrow)"/><path d="M531 246 L531 270" fill="none" stroke="#137b87" stroke-width="2" marker-end="url(#arrow)"/><text x="192" y="302" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="650" text-anchor="middle">944.05 亿元</text><text x="531" y="302" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="650" text-anchor="middle">81.87 亿元</text><rect x="112" y="330" width="496" height="72" rx="10" fill="#eaf1fa" stroke="#d2e0f1"/><text x="360" y="375" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="27" fill="#102b44" font-weight="650" text-anchor="middle">合计约 1,025.92 亿元人民币</text><rect x="32" y="418" width="656" height="74" rx="8" fill="#edf3f8" stroke="#edf3f8"/><text x="47" y="442" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">计算使用未取整的股数。A 股取深交所，H 股取港交所收盘。</text><text x="47" y="469" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">市值受股价、汇率和股本时点影响，作为该日截面阅读。</text></svg>