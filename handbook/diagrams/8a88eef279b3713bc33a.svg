<svg xmlns="http://www.w3.org/2000/svg" width="720" height="466" viewBox="0 0 720 466" role="img" aria-labelledby="title desc"><title id="title">一份纪要怎样变成可执行的待办</title><desc id="desc">企业应用流程示意 · 每一步都有负责人</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><rect width="720" height="466" rx="18" fill="#f7fafc"/><path d="M32 90H688" stroke="#dce5ed"/><text x="32" y="40" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="27" fill="#102b44" font-weight="600" text-anchor="start">一份纪要怎样变成可执行的待办</text><text x="32" y="69" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#526b80" font-weight="400" text-anchor="start">企业应用流程示意 · 每一步都有负责人</text><rect x="32" y="108" width="656" height="78" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="32" y="108" width="5" height="78" rx="2" fill="#3264c8" stroke="#3264c8"/><text x="50" y="143" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">取得授权</text><text x="50" y="174" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">核对谁能上传、查看和分发会议记录</text><path d="M360 187 L360 202" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="204" width="656" height="78" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="32" y="204" width="5" height="78" rx="2" fill="#137b87" stroke="#137b87"/><text x="50" y="239" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="start">生成草稿</text><text x="50" y="270" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">提取负责人、事项、时间与对应原话</text><path d="M360 283 L360 298" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="300" width="656" height="78" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="32" y="300" width="5" height="78" rx="2" fill="#3264c8" stroke="#3264c8"/><text x="50" y="335" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">确认后入库</text><text x="50" y="366" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">主管确认后写进项目系统，保留修改记录</text><rect x="32" y="387" width="656" height="47" rx="8" fill="#edf3f8" stroke="#edf3f8"/><text x="47" y="411" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">测量完整流程的用时，包括检查和返工。</text></svg>