<svg xmlns="http://www.w3.org/2000/svg" width="720" height="562" viewBox="0 0 720 562" role="img" aria-labelledby="title desc"><title id="title">从两颗计算裸片到一颗 Blackwell GPU</title><desc id="desc">英伟达工艺披露与台积电封装原理</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><rect width="720" height="562" rx="18" fill="#f7fafc"/><path d="M32 90H688" stroke="#dce5ed"/><text x="32" y="40" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="27" fill="#102b44" font-weight="600" text-anchor="start">从两颗计算裸片到一颗 Blackwell GPU</text><text x="32" y="69" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#526b80" font-weight="400" text-anchor="start">英伟达工艺披露与台积电封装原理</text><rect x="32" y="108" width="656" height="78" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="32" y="108" width="5" height="78" rx="2" fill="#3264c8" stroke="#3264c8"/><text x="50" y="143" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">设计与晶圆加工</text><text x="50" y="174" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">英伟达设计 · 台积电定制 4NP 工艺</text><path d="M360 187 L360 202" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="204" width="656" height="78" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="32" y="204" width="5" height="78" rx="2" fill="#137b87" stroke="#137b87"/><text x="50" y="239" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="start">筛选合格裸片</text><text x="50" y="270" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">每颗 GPU 使用两颗大计算裸片</text><path d="M360 283 L360 298" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="300" width="656" height="78" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="32" y="300" width="5" height="78" rx="2" fill="#3264c8" stroke="#3264c8"/><text x="50" y="335" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">先进封装与测试</text><text x="50" y="366" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">把计算部分与 HBM 接在一起，检查整包功能</text><path d="M360 379 L360 394" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="396" width="656" height="78" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="32" y="396" width="5" height="78" rx="2" fill="#137b87" stroke="#137b87"/><text x="50" y="431" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="start">装进计算托盘</text><text x="50" y="462" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">每柜 72 颗 GPU，装有 144 颗计算裸片</text><rect x="32" y="483" width="656" height="47" rx="8" fill="#edf3f8" stroke="#edf3f8"/><text x="47" y="507" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">144 颗为成品内的计算裸片推算，制造投片与报废率另外统计。</text></svg>