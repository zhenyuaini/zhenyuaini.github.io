e="#137b87"/><text x="386" y="253" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="start">72 颗 GPU</text><text x="386" y="284" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">18 × 4 · 运行 AI 模型</text><rect x="32" y="327" width="320" height="84" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="32" y="327" width="5" height="84" rx="2" fill="#137b87" stroke="#137b87"/><text x="50" y="362" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="start">9 个 NVLink 交换托盘</text><text x="50" y="393" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">柜内 GPU 高速互连</text><rect x="368" y="327" width="320" height="84" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="368" y="327" width="5" height="84" rx="2" fill="#3264c8" stroke="#3264c8"/><text x="386" y="362" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">2 台管理交换机</text><text x="386" y="393" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">连接机柜内管理接口</text><rect x="32" y="447" width="656" height="47" rx="8" fill="#edf3f8" stroke="#edf3f8"/><text x="47" y="471" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">本图列主要计算与交换部件。跨柜网络与机房设施另计。</text></svg>