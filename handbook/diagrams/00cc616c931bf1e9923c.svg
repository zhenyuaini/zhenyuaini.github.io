<svg xmlns="http://www.w3.org/2000/svg" width="720" height="680" viewBox="0 0 720 680" role="img" aria-labelledby="title desc"><title id="title">Leaf–Spine：数据怎样跨机柜流动？</title><desc id="desc">简化双层拓扑 · 连线表示逻辑连接，未表达端口或模块数量</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><rect width="720" height="680" rx="18" fill="#f7fafc"/><path d="M32 90H688" stroke="#dce5ed"/><text x="32" y="40" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="27" fill="#102b44" font-weight="600" text-anchor="start">Leaf–Spine：数据怎样跨机柜流动？</text><text x="32" y="69" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#526b80" font-weight="400" text-anchor="start">简化双层拓扑 · 连线表示逻辑连接，未表达端口或模块数量</text><rect x="146" y="124" width="146" height="92" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="146" y="124" width="5" height="92" rx="2" fill="#3264c8" stroke="#3264c8"/><text x="164" y="159" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">Spine</text><text x="164" y="190" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">汇聚交换</text><rect x="430" y="124" width="146" height="92" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="430" y="124" width="5" height="92" rx="2" fill="#3264c8" stroke="#3264c8"/><text x="448" y="159" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">Spine</text><text x="448" y="190" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">汇聚交换</text><rect x="47" y="311" width="190" height="92" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="47" y="311" width="5" height="92" rx="2" fill="#137b87" stroke="#137b87"/><text x="65" y="346" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="start">Leaf</text><text x="65" y="377" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">接入交换</text><rect x="265" y="311" width="190" height="92" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="265" y="311" width="5" height="92" rx="2" fill="#137b87" stroke="#137b87"/><text x="283" y="346" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="start">Leaf</text><text x="283" y="377" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">接入交换</text><rect x="483" y="311" width="190" height="92" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="483" y="311" width="5" height="92" rx="2" fill="#137b87" stroke="#137b87"/><text x="501" y="346" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="start">Leaf</text><text x="501" y="377" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">接入交换</text><path d="M219 221 L142 302" fill="none" stroke="#8ba5ba" stroke-width="2"/><path d="M219 221 L360 302" fill="none" stroke="#8ba5ba" stroke-width="2"/><path d="M219 221 L578 302" fill="none" stroke="#8ba5ba" stroke-width="2"/><path d="M503 221 L142 302" fill="none" stroke="#8ba5ba" stroke-width="2"/><path d="M503 221 L360 302" fill="none" stroke="#8ba5ba" stroke-width="2"/><path d="M503 221 L578 302" fill="none" stroke="#8ba5ba" stroke-width="2"/><rect x="47" y="455" width="190" height="84" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="47" y="455" width="5" height="84" rx="2" fill="#b58438" stroke="#b58438"/><text x="65" y="490" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#b58438" font-weight="600" text-anchor="start">计算节点</text><text x="65" y="521" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">网卡 / 加速器</text><path d="M142 450 L142 408" fill="none" stroke="#137b87" stroke-width="2" marker-end="url(#arrow)"/><rect x="265" y="455" width="190" height="84" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="265" y="455" width="5" height="84" rx="2" fill="#b58438" stroke="#b58438"/><text x="283" y="490" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#b58438" font-weight="600" text-anchor="start">计算节点</text><text x="283" y="521" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">网卡 / 加速器</text><path d="M360 450 L360 408" fill="none" stroke="#137b87" stroke-width="2" marker-end="url(#arrow)"/><rect x="483" y="455" width="190" height="84" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="483" y="455" width="5" height="84" rx="2" fill="#b58438" stroke="#b58438"/><text x="501" y="490" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#b58438" font-weight="600" text-anchor="start">计算节点</text><text x="501" y="521" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">网卡 / 加速器</text><path d="M578 450 L578 408" fill="none" stroke="#137b87" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="574" width="656" height="74" rx="8" fill="#edf3f8" stroke="#edf3f8"/><text x="47" y="598" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">跨 Leaf 通信经过 Spine；每段用光还是铜，取决于距离与接口。</text><text x="47" y="625" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">按已启用的端口逐端计数，不能直接用 GPU 数乘固定倍数。</text></svg>