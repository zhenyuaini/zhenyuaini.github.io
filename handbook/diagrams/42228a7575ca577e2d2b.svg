<svg xmlns="http://www.w3.org/2000/svg" width="720" height="610" viewBox="0 0 720 610" role="img" aria-labelledby="title desc"><title id="title">MCU 与 NOR：控制器和程序存储分开看</title><desc id="desc">功能关系示意 · 外部 NOR 是按系统需要选配的器件</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><rect width="720" height="610" rx="18" fill="#f7fafc"/><path d="M32 90H688" stroke="#dce5ed"/><text x="32" y="40" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="27" fill="#102b44" font-weight="600" text-anchor="start">MCU 与 NOR：控制器和程序存储分开看</text><text x="32" y="69" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#526b80" font-weight="400" text-anchor="start">功能关系示意 · 外部 NOR 是按系统需要选配的器件</text><rect x="34" y="139" width="270" height="92" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="34" y="139" width="5" height="92" rx="2" fill="#137b87" stroke="#137b87"/><text x="52" y="174" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="start">传感器 / 按键</text><text x="52" y="205" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">温度、位置或用户输入</text><rect x="416" y="139" width="270" height="92" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="416" y="139" width="5" height="92" rx="2" fill="#b58438" stroke="#b58438"/><text x="434" y="174" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#b58438" font-weight="600" text-anchor="start">电机 / 显示 / 通信</text><text x="434" y="205" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">设备输出与执行</text><rect x="158" y="312" width="404" height="128" rx="10" fill="#e6edfb" stroke="#9eb4dc"/><text x="360" y="349" font-family="Microsoft YaHei, PingFang SC, san