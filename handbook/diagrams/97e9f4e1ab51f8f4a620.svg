<svg xmlns="http://www.w3.org/2000/svg" width="720" height="670" viewBox="0 0 720 670" role="img" aria-labelledby="title desc"><title id="title">行业空间到利润：每一层分母都不同</title><desc id="desc">教学假设 · 采用正文的一页研究卡算例</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><rect width="720" height="670" rx="18" fill="#f7fafc"/><path d="M32 90H688" stroke="#dce5ed"/><text x="32" y="40" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="27" fill="#102b44" font-weight="600" text-anchor="start">行业空间到利润：每一层分母都不同</text><text x="32" y="69" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#526b80" font-weight="400" text-anchor="start">教学假设 · 采用正文的一页研究卡算例</text><rect x="32" y="117" width="656" height="88" rx="10" fill="#fff" stroke="#d3e0ea"/><text x="48" y="150" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">行业总市场</text><text x="48" y="182" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#526b80" font-weight="400" text-anchor="start">先固定产品、区域与年度</text><text x="667" y="151" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="end">100 亿元</text><rect x="32" y="222" width="656" height="88" rx="10" fill="#fff" stroke="#d3e0ea"/><text x="48" y="255" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">可服务市场</text><text x="48" y="287" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#526b80" font-weight="400" text-anchor="start">公司能进入其中 60%</text><text x="667" y="256" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="end">60 亿元</text><rect x="32" y="327" width="656" height="88" rx="10" fill="#fff" stroke="#d3e0ea"/><text x="48" y="360" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">公司收入</text><text x="48" y="392" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#526b80" font-weight="400" text-anchor="start">可服务市场的 10% 份额</text><text x="667" y="361" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="end">6 亿元</text><rect x="32" y="432" width="656" height="88" rx="10" fill="#fff" stroke="#d3e0ea"/><text x="48" y="465" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">公司毛利</text><text x="48" y="497" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#526b80" font-weight="400" text-anchor="start">再乘 30% 毛利率</text><text x="667" y="466" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="end">1.8 亿元</text><rect x="32" y="591" width="656" height="47" rx="8" fill="#edf3f8" stroke="#edf3f8"/><text x="47" y="615" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">毛利后还需扣除费用、税等；不能把行业收入直接乘公司市盈率。</text></svg>