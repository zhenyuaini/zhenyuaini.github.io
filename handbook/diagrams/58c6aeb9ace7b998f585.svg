<svg xmlns="http://www.w3.org/2000/svg" width="720" height="423" viewBox="0 0 720 423" role="img" aria-labelledby="title desc"><title id="title">一台 AI 服务器要解决四件事</title><desc id="desc">功能示意 · 实际设备的部件和布局随平台变化</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><rect width="720" height="423" rx="18" fill="#f7fafc"/><path d="M32 90H688" stroke="#dce5ed"/><text x="32" y="40" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="27" fill="#102b44" font-weight="600" text-anchor="start">一台 AI 服务器要解决四件事</text><text x="32" y="69" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#526b80" font-weight="400" text-anchor="start">功能示意 · 实际设备的部件和布局随平台变化</text><rect x="32" y="118" width="314" height="89" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="32" y="118" width="5" height="89" rx="2" fill="#3264c8" stroke="#3264c8"/><text x="50" y="153" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">算得出来</text><text x="50" y="184" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">处理器做计算</text><rect x="373" y="118" width="315" height="89" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="373" y="118" width="5" height="89" rx="2" fill="#137b87" stroke="#137b87"/><text x="391" y="153" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="start">读得到数据</text><text x="391" y="184" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">内存快速读写，SSD 存文件</text><rect x="32" y="229" width="314" height="89" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="32" y="229" width="5" height="89" rx="2" fill="#3264c8" stroke="#3264c8"/><text x="50" y="264" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">和其他设备连接</text><text x="50" y="295" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">电路板连内部，网络连设备</text><rect x="373" y="229" width="315" height="89" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="373" y="229" width="5" height="89" rx="2" fill="#137b87" stroke="#137b87"/><text x="391" y="264" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="start">能稳定运行</text><text x="391" y="295" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">供电送电，散热把热排出去</text><rect x="32" y="344" width="656" height="47" rx="8" fill="#edf3f8" stroke="#edf3f8"/><text x="47" y="368" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">机房里还要有足够的电力、冷却和可用网络。</text></svg>