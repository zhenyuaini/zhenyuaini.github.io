<svg xmlns="http://www.w3.org/2000/svg" width="720" height="670" viewBox="0 0 720 670" role="img" aria-labelledby="title desc"><title id="title">从员工数到次年付费席位</title><desc id="desc">教学假设 · 无新客补入，全部采用正文固定参数</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><rect width="720" height="670" rx="18" fill="#f7fafc"/><path d="M32 90H688" stroke="#dce5ed"/><text x="32" y="40" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="27" fill="#102b44" font-weight="600" text-anchor="start">从员工数到次年付费席位</text><text x="32" y="69" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#526b80" font-weight="400" text-anchor="start">教学假设 · 无新客补入，全部采用正文固定参数</text><rect x="32" y="117" width="656" height="88" rx="10" fill="#fff" stroke="#d3e0ea"/><text x="48" y="150" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">全员人数</text><text x="48" y="182" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#526b80" font-weight="400" text-anchor="start">先筛出适合部署的岗位</text><text x="667" y="151" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="end">10,000 人</text><rect x="32" y="222" width="656" height="88" rx="10" fill="#fff" stroke="#d3e0ea"/><text x="48" y="255" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">岗位适用</text><text x="48" y="287" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#526b80" font-weight="400" text-anchor="start">3,000 人适用</text><text x="667" y="256" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="end">30%</text><rect x="32" y="327" width="656" height="88" rx="10" fill="#fff" stroke="#d3e0ea"/><text x="48" y="360" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">预算批准</text><text x="48" y="392" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#526b80" font-weight="400" text-anchor="start">适用人数的 60% 获批</text><text x="667" y="361" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="end">1,800 席</text><rect x="32" y="432" width="656" height="88" rx="10" fill="#fff" stroke="#d3e0ea"/><text x="48" y="465" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">次年留存</text><text x="48" y="497" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#526b80" font-weight="400" text-anchor="start">已购席位的 80% 保留</text><text x="667" y="466" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="end">1,440 席</text><rect x="32" y="591" width="656" height="47" rx="8" fill="#edf3f8" stroke="#edf3f8"/><text x="47" y="615" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">席位收入另乘实际净价；按任务计费的产品需要另算可计费任务。</text></svg>