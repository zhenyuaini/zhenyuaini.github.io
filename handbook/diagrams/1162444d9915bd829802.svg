<svg xmlns="http://www.w3.org/2000/svg" width="720" height="590" viewBox="0 0 720 590" role="img" aria-labelledby="title desc"><title id="title">跟一度电从电网走到芯片</title><desc id="desc">功能路径示意 · 冗余、备用与变换级数因项目而异</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><rect width="720" height="590" rx="18" fill="#f7fafc"/><path d="M32 90H688" stroke="#dce5ed"/><text x="32" y="40" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="27" fill="#102b44" font-weight="600" text-anchor="start">跟一度电从电网走到芯片</text><text x="32" y="69" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#526b80" font-weight="400" text-anchor="start">功能路径示意 · 冗余、备用与变换级数因项目而异</text><rect x="32" y="116" width="312" height="92" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="32" y="116" width="5" height="92" rx="2" fill="#3264c8" stroke="#3264c8"/><text x="50" y="151" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">电网 / 变压器</text><text x="50" y="182" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">获得可交付的园区电力</text><path d="M348 162 L371 162" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><rect x="376" y="116" width="312" height="92" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="376" y="116" width="5" height="92" rx="2" fill="#137b87" stroke="#137b87"/><text x="394" y="151" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="start">配电 / UPS</text><text x="394" y="182" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">保护、分路与切换保障</text><path d="M532 212 V224 H188 V235" fill="none" stroke="#526b80" stroke-width="2" mar