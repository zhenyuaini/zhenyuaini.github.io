ei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="start">GPU / HBM</text><text x="394" y="426" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">计算与访存产生热量</text><rect x="32" y="511" width="656" height="47" rx="8" fill="#edf3f8" stroke="#edf3f8"/><text x="47" y="535" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">电源铭牌总功率、机柜实际负荷和一段时间的电量是三个数。</text></svg>