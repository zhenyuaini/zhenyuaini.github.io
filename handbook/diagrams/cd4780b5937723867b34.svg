<svg xmlns="http://www.w3.org/2000/svg" width="720" height="502" viewBox="0 0 720 502" role="img" aria-labelledby="title desc"><title id="title">任务翻倍，计算用量增加多少？</title><desc id="desc">教学假设 · 前一天的任务数和计算时间均以 100 为基准</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><rect width="720" height="502" rx="18" fill="#f7fafc"/><path d="M32 90H688" stroke="#dce5ed"/><text x="32" y="40" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="27" fill="#102b44" font-weight="600" text-anchor="start">任务翻倍，计算用量增加多少？</text><text x="32" y="69" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#526b80" font-weight="400" text-anchor="start">教学假设 · 前一天的任务数和计算时间均以 100 为基准</text><text x="36" y="125" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" fill="#102b44" font-weight="650" text-anchor="start">处理的任务份数</text><text x="36" y="263" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" fill="#102b44" font-weight="650" text-anchor="start">占用的总计算时间</text><text x="36" y="165" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">原来</text><rect x="150" y="144" width="235.0" height="27" rx="5" fill="#3264c8" stroke="#3264c8"/><text x="398.0" y="165" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#3264c8" font-weight="650" text-anchor="start">100</text><text x="36" y="206" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">后来</text><rect x="150" y="185" width="470.0" height="27" rx="5" fill="#137b87" stroke="#137b87"/><text x="633.0" y="206" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#137b87" font-weight="650" text-anchor="start">200</text><text x="36" y="303" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">原来</text><rect x="150" y="282" width="235.0" height="27" rx="5" fill="#3264c8" stroke="#3264c8"/><text x="398.0" y="303" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#3264c8" font-weight="650" text-anchor="start">100</text><text x="36" y="344" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">后来</text><rect x="150" y="323" width="282.0" height="27" rx="5" fill="#137b87" stroke="#137b87"/><text x="445.0" y="344" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#137b87" font-weight="650" text-anchor="start">120</text><rect x="32" y="396" width="656" height="74" rx="8" fill="#edf3f8" stroke="#edf3f8"/><text x="47" y="420" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">同样质量和速度下，每份任务耗时降为原来的 60%。</text><text x="47" y="447" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">任务数量变为 2 倍 × 单份耗时变为 0.6 倍，合计占用 1.2 倍。</text></svg>