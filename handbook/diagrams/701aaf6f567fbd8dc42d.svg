<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640" role="img" aria-labelledby="title desc"><title id="title">液冷不是一根水管：两套水路隔着换热器</title><desc id="desc">液—液 CDU 示意 · 设备侧和设施侧不混水</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><rect width="720" height="640" rx="18" fill="#f7fafc"/><path d="M32 90H688" stroke="#dce5ed"/><text x="32" y="40" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="27" fill="#102b44" font-weight="600" text-anchor="start">液冷不是一根水管：两套水路隔着换热器</text><text x="32" y="69" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#526b80" font-weight="400" text-anchor="start">液—液 CDU 示意 · 设备侧和设施侧不混水</text><rect x="35" y="146" width="232" height="92" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="35" y="146" width="5" height="92" rx="2" fill="#b58438" stroke="#b58438"/><text x="53" y="181" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#b58438" font-weight="600" text-anchor="start">芯片 + 冷板</text><text x="53" y="212" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">设备侧吸热</text><rect x="448" y="146" width="232" height="92" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="448" y="146" width="5" height="92" rx="2" fill="#137b87" stroke="#137b87"/><text x="466" y="181" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="start">设施冷源</text><text x="466" y="212" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">向室外环境排热</text><rect x="291" y="295" width="138" height="135" rx="10" fill="#e2edf4" stroke="#8eacbc"/><text x="360" y="331" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="28" fill="#3264c8" font-weight="600" text-anchor="middle">CDU</text><text x="360" y="367" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" fill="#102b44" font-weight="400" text-anchor="middle">泵 / 换热器</text><text x="360" y="401" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#526b80" font-weight="400" text-anchor="middle">两侧分隔</text><path d="M151 241 L151 333" fill="none" stroke="#b58438" stroke-width="3" marker-end="url(#arrow)"/><path d="M151 333 L281 333" fill="none" stroke="#b58438" stroke-width="3" marker-end="url(#arrow)"/><path d="M281 399 L96 399" fill="none" stroke="#3264c8" stroke-width="3" marker-end="url(#arrow)"/><path d="M96 399 L96 241" fill="none" stroke="#3264c8" stroke-width="3" marker-end="url(#arrow)"/><path d="M439 333 L564 333" fill="none" stroke="#b58438" stroke-width="3" marker-end="url(#arrow)"/><path d="M564 333 L564 241" fill="none" stroke="#b58438" stroke-width="3" marker-end="url(#arrow)"/><path d="M620 241 L620 399" fill="none" stroke="#137b87" stroke-width="3" marker-end="url(#arrow)"/><path d="M620 399 L439 399" fill="none" stroke="#137b87" stroke-width="3" marker-end="url(#arrow)"/><text x="35" y="474" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="23" fill="#3264c8" font-weight="600" text-anchor="start">设备侧循环</text><text x="485" y="474" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="23" fill="#137b87" font-weight="600" text-anchor="start">设施侧循环</text><rect x="32" y="534" width="656" height="74" rx="8" fill="#edf3f8" stroke="#edf3f8"/><text x="47" y="558" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">图中暖色表示带走热量，冷色表示冷却后回流。</text><text x="47" y="585" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">冷板未覆盖的余热仍可走空气侧；额定换热能力须比较工况。</text></svg>