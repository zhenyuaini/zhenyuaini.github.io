<svg xmlns="http://www.w3.org/2000/svg" width="720" height="414" viewBox="0 0 720 414" role="img" aria-labelledby="title desc"><title id="title">一片晶圆最后能交多少合格裸片？</title><desc id="desc">教学假设 · 只比较裸片筛选通过量</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><rect width="720" height="414" rx="18" fill="#f7fafc"/><path d="M32 90H688" stroke="#dce5ed"/><text x="32" y="40" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="27" fill="#102b44" font-weight="600" text-anchor="start">一片晶圆最后能交多少合格裸片？</text><text x="32" y="69" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#526b80" font-weight="400" text-anchor="start">教学假设 · 只比较裸片筛选通过量</text><rect x="32" y="116" width="210" height="211" rx="10" fill="#fff" stroke="#d3e0ea"/><text x="48" y="151" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" fill="#3264c8" font-weight="650" text-anchor="start">旧工艺</text><text x="48" y="208" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="33" fill="#102b44" font-weight="650" text-anchor="start">180 颗</text><text x="48" y="248" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#526b80" font-weight="400" text-anchor="start">可排 200 颗</text><text x="48" y="278" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#526b80" font-weight="400" text-anchor="start">良率 90%</text><rect x="255" y="116" width="210" height="211" rx="10" fill="#fff" stroke="#d3e0ea"/><text x="271" y="151" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" fill="#137b87" font-weight="650" text-anchor="start">新工艺试产</text><text x="271" y="208" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="33" fill="#102b44" font-weight="650" text-anchor="start">180 颗</text><text x="271" y="248" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#526b80" font-weight="400" text-anchor="start">可排 250 颗</text><text x="271" y="278" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#526b80" font-weight="400" text-anchor="start">良率 72%</text><rect x="478" y="116" width="210" height="211" rx="10" fill="#fff" stroke="#d3e0ea"/><text x="494" y="151" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" fill="#137b87" font-weight="650" text-anchor="start">新工艺爬坡后</text><text x="494" y="208" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="33" fill="#102b44" font-weight="650" text-anchor="start">200 颗</text><text x="494" y="248" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#526b80" font-weight="400" text-anchor="start">可排 250 颗</text><text x="494" y="278" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#526b80" font-weight="400" text-anchor="start">良率 80%</text><rect x="32" y="335" width="656" height="47" rx="8" fill="#edf3f8" stroke="#edf3f8"/><text x="47" y="359" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">每片合格裸片数量 = 可排颗数 × 良率。</text></svg>