<svg xmlns="http://www.w3.org/2000/svg" width="720" height="434" viewBox="0 0 720 434" role="img" aria-labelledby="title desc"><title id="title">一柜约 120 kW，为何装了 264 kW？</title><desc id="desc">英伟达 DGX GB200 · 功耗说明与电源铭牌分开</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><rect width="720" height="434" rx="18" fill="#f7fafc"/><path d="M32 90H688" stroke="#dce5ed"/><text x="32" y="40" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="27" fill="#102b44" font-weight="600" text-anchor="start">一柜约 120 kW，为何装了 264 kW？</text><text x="32" y="69" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#526b80" font-weight="400" text-anchor="start">英伟达 DGX GB200 · 功耗说明与电源铭牌分开</text><rect x="32" y="113" width="319" height="224" rx="10" fill="#fff" stroke="#d3e0ea"/><text x="52" y="149" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="23" fill="#3264c8" font-weight="650" text-anchor="start">机柜功耗口径</text><text x="52" y="189" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#526b80" font-weight="400" text-anchor="start">手册所列功耗</text><text x="331" y="189" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" fill="#102b44" font-weight="650" text-anchor="end">约 120 kW</text><text x="52" y="226" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#526b80" font-weight="400" text-anchor="start">规划用途</text><text x="331" y="226" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" fill="#102b44" font-weight="650" text-anchor="end">机柜负荷起点</text><rect x="369" y="113" width="319" height="224" rx="10" fill="#fff" stroke="#d3e0ea"/><text x="389" y="149" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="23" fill="#137b87" font-weight="650" text-anchor="start">电源配置口径</text><text x="389" y="18