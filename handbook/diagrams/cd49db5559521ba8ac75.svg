<svg xmlns="http://www.w3.org/2000/svg" width="720" height="565" viewBox="0 0 720 565" role="img" aria-labelledby="title desc"><title id="title">板数减少，板材用量为何反而增加？</title><desc id="desc">教学假设 · 使用正文同一笔订单，目标板材等级保持一致</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><rect width="720" height="565" rx="18" fill="#f7fafc"/><path d="M32 90H688" stroke="#dce5ed"/><text x="32" y="40" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="27" fill="#102b44" font-weight="600" text-anchor="start">板数减少，板材用量为何反而增加？</text><text x="32" y="69" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#526b80" font-weight="400" text-anchor="start">教学假设 · 使用正文同一笔订单，目标板材等级保持一致</text><rect x="32" y="117" width="656" height="88" rx="10" fill="#fff" stroke="#d3e0ea"/><text x="48" y="150" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">原订单</text><text x="48" y="182" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#526b80" font-weight="400" text-anchor="start">10,000 块 × 0.10㎡ × 4 张 ÷ 80%</text><text x="667" y="151" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="end">5,000㎡</text><rect x="32" y="222" width="656" height="88" rx="10" fill="#fff" stroke="#d3e0ea"/><text x="48" y="255" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">新订单</text><text x="48" y="287" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#526b80" font-weight="400" text-anchor="start">8,000 块 × 0.10㎡ × 6 张 ÷ 80%</text><text x="667" y="256" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="end">6,000㎡</text><rect x="32" y="327" width="656" height="88" rx="10" fill="#fff" stroke="#d3e0ea"/><text x="48" y="360" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">需求变化</text><text x="48" y="392" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#526b80" font-weight="400" text-anchor="start">合格板减少 20%，芯板张数上升</text><text x="667" y="361" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="end">+20%</text><rect x="32" y="486" width="656" height="47" rx="8" fill="#edf3f8" stroke="#edf3f8"/><text x="47" y="510" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">这里数的是目标等级覆铜板采购面积，不是铜层数或成品板面积。</text></svg>