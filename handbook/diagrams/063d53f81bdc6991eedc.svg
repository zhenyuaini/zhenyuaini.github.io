<svg xmlns="http://www.w3.org/2000/svg" width="720" height="590" viewBox="0 0 720 590" role="img" aria-labelledby="title desc"><title id="title">一层芯片图案怎样做出来？</title><desc id="desc">常见工序的简化例子 · 顺序与次数取决于工艺</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><rect width="720" height="590" rx="18" fill="#f7fafc"/><path d="M32 90H688" stroke="#dce5ed"/><text x="32" y="40" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="27" fill="#102b44" font-weight="600" text-anchor="start">一层芯片图案怎样做出来？</text><text x="32" y="69" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#526b80" font-weight="400" text-anchor="start">常见工序的简化例子 · 顺序与次数取决于工艺</text><rect x="32" y="116" width="312" height="92" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="32" y="116" width="5" height="92" rx="2" fill="#3264c8" stroke="#3264c8"/><text x="50" y="151" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">沉积薄膜</text><text x="50" y="182" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">形成目标材料层</text><path d="M348 162 L371 162" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><rect x="376" y="116" width="312" height="92" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="376" y="116" width="5" height="92" rx="2" fill="#137b87" stroke="#137b87"/><text x="394" y="151" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="start">涂胶 / 曝光 / 显影</text><text x="394" y="182" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">用光刻胶定义加工区域</text><path d="M532 212 V224 H188 V235" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="238" width="312" height="92" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="32" y="238" width="5" height="92" rx="2" fill="#3264c8" stroke="#3264c8"/><text x="50" y="273" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">刻蚀等加工</text><text x="50" y="304" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">将图案转入目标材料</text><path d="M348 284 L371 284" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><rect x="376" y="238" width="312" height="92" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="376" y="238" width="5" height="92" rx="2" fill="#137b87" stroke="#137b87"/><text x="394" y="273" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="start">去胶 / 清洗 / CMP</text><text x="394" y="304" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">按需要去残留、平坦化</text><path d="M532 334 V346 H188 V357" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="360" width="312" height="92" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="32" y="360" width="5" height="92" rx="2" fill="#3264c8" stroke="#3264c8"/><text x="50" y="395" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">量测与缺陷检测</text><text x="50" y="426" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">发现偏差并反馈工艺</text><path d="M348 406 L371 406" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><rect x="376" y="360" width="312" height="92" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="376" y="360" width="5" height="92" rx="2" fill="#137b87" stroke="#137b87"/><text x="394" y="395" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="start">重复构建下一层</text><text x="394" y="426" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">并非每一层都采用 EUV</text><rect x="32" y="511" width="656" height="47" rx="8" fill="#edf3f8" stroke="#edf3f8"/><text x="47" y="535" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">光刻负责图形转移的一部分，不能由一台光刻机独立造完芯片。</text></svg>