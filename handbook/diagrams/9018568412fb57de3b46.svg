<svg xmlns="http://www.w3.org/2000/svg" width="720" height="684" viewBox="0 0 720 684" role="img" aria-labelledby="title desc"><title id="title">AI 产业的五层</title><desc id="desc">从你用到的服务，往下看到支撑它的设备和制造</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><rect width="720" height="684" rx="18" fill="#f7fafc"/><path d="M32 90H688" stroke="#dce5ed"/><text x="32" y="40" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="27" fill="#102b44" font-weight="600" text-anchor="start">AI 产业的五层</text><text x="32" y="69" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#526b80" font-weight="400" text-anchor="start">从你用到的服务，往下看到支撑它的设备和制造</text><rect x="32" y="112" width="656" height="79" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="32" y="112" width="5" height="79" rx="2" fill="#3264c8" stroke="#3264c8"/><text x="50" y="147" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">应用</text><text x="50" y="178" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">你用的聊天、写作、客服或编程工具</text><path d="M360 192 L360 205" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="208" width="656" height="79" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="32" y="208" width="5" height="79" rx="2" fill="#3264c8" stroke="#3264c8"/><text x="50" y="243" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">模型</text><text x="50" y="274" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">读懂任务并产生回答的能力</text><path d="M360 288 L360 301" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="304" width="656" height="79" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="32" y="304" width="5" height="79" rx="2" fill="#137b87" stroke="#137b87"/><text x="50" y="339" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="start">算力</text><text x="50" y="370" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">云服务、服务器与运行设备的机房</text><path d="M360 384 L360 397" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="400" width="656" height="79" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="32" y="400" width="5" height="79" rx="2" fill="#137b87" stroke="#137b87"/><text x="50" y="435" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="start">部件</text><text x="50" y="466" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">计算芯片、内存、电路板、网络和供电</text><path d="M360 480 L360 493" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="496" width="656" height="79" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="32" y="496" width="5" height="79" rx="2" fill="#137b87" stroke="#137b87"/><text x="50" y="531" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="start">制造</text><text x="50" y="562" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">设计、晶圆加工、封装和测试</text><rect x="32" y="605" width="656" height="47" rx="8" fill="#edf3f8" stroke="#edf3f8"/><text x="47" y="629" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">向下看服务依赖什么。向上看用户的需求怎样传给供应商。</text></svg>