<svg xmlns="http://www.w3.org/2000/svg" width="720" height="562" viewBox="0 0 720 562" role="img" aria-labelledby="title desc"><title id="title">图纸上的线路怎样留在晶圆上？</title><desc id="desc">原理示意 · 不同层按各自工艺循环</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><rect width="720" height="562" rx="18" fill="#f7fafc"/><path d="M32 90H688" stroke="#dce5ed"/><text x="32" y="40" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="27" fill="#102b44" font-weight="600" text-anchor="start">图纸上的线路怎样留在晶圆上？</text><text x="32" y="69" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#526b80" font-weight="400" text-anchor="start">原理示意 · 不同层按各自工艺循环</text><rect x="32" y="108" width="656" height="78" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="32" y="108" width="5" height="78" rx="2" fill="#3264c8" stroke="#3264c8"/><text x="50" y="143" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">沉积</text><text x="50" y="174" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">在硅片上铺一层薄膜</text><path d="M360 187 L360 202" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="204" width="656" height="78" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="32" y="204" width="5" height="78" rx="2" fill="#137b87" stroke="#137b87"/><text x="50" y="239" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="start">光刻和显影</text><text x="50" y="270" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">把掩模图形投射在胶上，显影后露出待加工位置</text><path d="M360 283 L360 298" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="300" width="656" height="78" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="32" y="300" width="5" height="78" rx="2" fill="#3264c8" stroke="#3264c8"/><text x="50" y="335" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">刻蚀</text><text x="50" y="366" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">选择性移除暴露区域，把图案留在膜上</text><path d="M360 379 L360 394" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="396" width="656" height="78" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="32" y="396" width="5" height="78" rx="2" fill="#137b87" stroke="#137b87"/><text x="50" y="431" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="start">量测与检测</text><text x="50" y="462" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">测尺寸和位置，找异常并反馈给产线</text><rect x="32" y="483" width="656" height="47" rx="8" fill="#edf3f8" stroke="#edf3f8"/><text x="47" y="507" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">图中只展开一种图案转移路径，实际制造还包含清洗等步骤。</text></svg>