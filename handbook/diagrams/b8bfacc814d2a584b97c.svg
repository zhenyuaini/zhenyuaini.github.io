<svg xmlns="http://www.w3.org/2000/svg" width="720" height="564" viewBox="0 0 720 564" role="img" aria-labelledby="title desc"><title id="title">光引擎在哪里？</title><desc id="desc">以交换机一端为例 · 三类连接位置示意</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><rect width="720" height="564" rx="18" fill="#f7fafc"/><path d="M32 90H688" stroke="#dce5ed"/><text x="32" y="40" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="27" fill="#102b44" font-weight="600" text-anchor="start">光引擎在哪里？</text><text x="32" y="69" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#526b80" font-weight="400" text-anchor="start">以交换机一端为例 · 三类连接位置示意</text><text x="36" y="160" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="22" fill="#102b44" font-weight="650" text-anchor="start">可插拔</text><rect x="154" y="135" width="156" height="50" rx="10" fill="#eaf1fa" stroke="#c9d8eb"/><text x="232" y="167" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#3264c8" font-weight="600" text-anchor="middle">交换 ASIC</text><path d="M314 160 L496 160" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><text x="406" y="128" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#526b80" font-weight="400" text-anchor="middle">板上电通道</text><rect x="501" y="135" width="170" height="50" rx="10" fill="#e2f1f1" stroke="#bddbdd"/><text x="586" y="167" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#137b87" font-weight="650" text-anchor="middle">前面板光模块</text><text x="36" y="270" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="22" fill="#102b44" font-weight="650" text-anchor="start">NPO</text><rect x="154" y="245" width="156" height="50" rx="10" fill="#eaf1fa" stroke="#c9d8eb"/><text x="232" y="277" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#3264c8" font-weight="600" text-anchor="middle">交换 ASIC</text><path d="M314 270 L496 270" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><text x="406" y="238" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#526b80" font-weight="400" text-anchor="middle">较短电通道</text><rect x="501" y="245" width="170" height="50" rx="10" fill="#e2f1f1" stroke="#bddbdd"/><text x="586" y="277" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#137b87" font-weight="650" text-anchor="middle">近封装光引擎</text><text x="36" y="380" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="22" fill="#102b44" font-weight="650" text-anchor="start">CPO</text><rect x="154" y="355" width="156" height="50" rx="10" fill="#eaf1fa" stroke="#c9d8eb"/><text x="232" y="387" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#3264c8" font-weight="600" text-anchor="middle">交换 ASIC</text><path d="M314 380 L496 380" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><text x="406" y="348" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#526b80" font-weight="400" text-anchor="middle">封装内互连</text><rect x="501" y="355" width="170" height="50" rx="10" fill="#e2f1f1" stroke="#bddbdd"/><text x="586" y="387" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#137b87" font-weight="650" text-anchor="middle">共封装光引擎</text><path d="M150 416 L674 416" fill="none" stroke="#b58438" stroke-width="2" stroke-dasharray="6 5"/><text x="411" y="438" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#b58438" font-weight="400" text-anchor="middle">交换 ASIC 与光引擎同封装</text><rect x="32" y="458" width="656" height="74" rx="8" fill="#edf3f8" stroke="#edf3f8"/><text x="47" y="482" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">同一速率、距离和端口密度再比功耗、良率、维修与互通。</text><text x="47" y="509" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">NPO 是否可现场更换以及 CPO 激光源位置，都需按设备查。</text></svg>