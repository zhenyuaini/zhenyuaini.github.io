<svg xmlns="http://www.w3.org/2000/svg" width="720" height="650" viewBox="0 0 720 650" role="img" aria-labelledby="title desc"><title id="title">一条光链路，两次光电转换</title><desc id="desc">单向数据路径示意 · 双向通信还包括对应的反向通道</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><rect width="720" height="650" rx="18" fill="#f7fafc"/><path d="M32 90H688" stroke="#dce5ed"/><text x="32" y="40" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="27" fill="#102b44" font-weight="600" text-anchor="start">一条光链路，两次光电转换</text><text x="32" y="69" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#526b80" font-weight="400" text-anchor="start">单向数据路径示意 · 双向通信还包括对应的反向通道</text><rect x="38" y="115" width="286" height="82" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="38" y="115" width="5" height="82" rx="2" fill="#3264c8" stroke="#3264c8"/><text x="56" y="150" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">发送端设备</text><text x="56" y="181" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">交换机 / 网卡</text><rect x="395" y="115" width="286" height="82" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="395" y="115" width="5" height="82" rx="2" fill="#3264c8" stroke="#3264c8"/><text x="413" y="150" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">接收端设备</text><text x="413" y="181" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">交换机 / 网卡</text><rect x="38" y="243" width="286" height="92" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="38" y="243" width="5" height="92" rx="2" fill="#137b87" stroke="#137b87"/><text x="56" y="278" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="start">驱动 → 发光 / 调制</text><text x="56" y="309" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">电信号写入光信号</text><rect x="395" y="243" width="286" height="92" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="395" y="243" width="5" height="92" rx="2" fill="#137b87" stroke="#137b87"/><text x="413" y="278" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="start">探测 → 放大 / 接收</text><text x="413" y="309" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">光信号还原为电信号</text><path d="M181 201 L181 234" fill="none" stroke="#3264c8" stroke-width="2" marker-end="url(#arrow)"/><path d="M538 235 L538 201" fill="none" stroke="#3264c8" stroke-width="2" marker-end="url(#arrow)"/><path d="M181 342 L181 414" fill="none" stroke="#b58438" stroke-width="2"/><path d="M181 414 L538 414" fill="none" stroke="#b58438" stroke-width="5" marker-end="url(#arrow)"/><path d="M538 414 L538 342" fill="none" stroke="#b58438" stroke-width="2" marker-end="url(#arrow)"/><text x="360" y="393" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="27" fill="#b58438" font-weight="600" text-anchor="middle">光纤传输</text><text x="360" y="476" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="32" fill="#102b44" font-weight="600" text-anchor="middle">电 → 光 → 电</text><rect x="32" y="544" width="656" height="74" rx="8" fill="#edf3f8" stroke="#edf3f8"/><text x="47" y="568" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">模块常同时具备收发功能；图中只展开一个传输方向。</text><text x="47" y="595" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">DSP 的位置与是否采用 DSP，需按可插拔、LPO 等具体方案判断。</text></svg>