<svg xmlns="http://www.w3.org/2000/svg" width="720" height="466" viewBox="0 0 720 466" role="img" aria-labelledby="title desc"><title id="title">从整柜出货到云端服务</title><desc id="desc">戴尔与 CoreWeave 公告 · 各事件独立记录</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><rect width="720" height="466" rx="18" fill="#f7fafc"/><path d="M32 90H688" stroke="#dce5ed"/><text x="32" y="40" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="27" fill="#102b44" font-weight="600" text-anchor="start">从整柜出货到云端服务</text><text x="32" y="69" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#526b80" font-weight="400" text-anchor="start">戴尔与 CoreWeave 公告 · 各事件独立记录</text><rect x="32" y="108" width="656" height="78" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="32" y="108" width="5" height="78" rx="2" fill="#3264c8" stroke="#3264c8"/><text x="50" y="143" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">2024-12-09 · 出货</text><text x="50" y="174" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">戴尔公告向 CoreWeave 出货集成 GB200 NVL72 的机柜</text><path d="M360 187 L360 202" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="204" width="656" height="78" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="32" y="204" width="5" height="78" rx="2" fill="#137b87" stroke="#137b87"/><text x="50" y="239" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="start">2025-02-04 · 正式可用</text><text x="50" y="270" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">CoreWeave 宣布基于 GB200 NVL72 的实例正式可用</text><path d="M360 283 L360 298" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="300" width="656" height="78" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="32" y="300" width="5" height="78" rx="2" fill="#3264c8" stroke="#3264c8"/><text x="50" y="335" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">2025-04-15 · 点名客户</text><text x="50" y="366" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">CoreWeave 披露 Cohere、IBM 和 Mistral AI 获得访问</text><rect x="32" y="387" width="656" height="47" rx="8" fill="#edf3f8" stroke="#edf3f8"/><text x="47" y="411" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">公告未逐台对应同一批机柜，无法从日期差推定交付或验收周期。</text></svg>