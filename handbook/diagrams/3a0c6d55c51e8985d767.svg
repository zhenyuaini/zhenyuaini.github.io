<svg xmlns="http://www.w3.org/2000/svg" width="720" height="590" viewBox="0 0 720 590" role="img" aria-labelledby="title desc"><title id="title">材料究竟在哪道工序消耗？</title><desc id="desc">按功能分组 · 卡片之间不表示连续的工艺顺序</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><rect width="720" height="590" rx="18" fill="#f7fafc"/><path d="M32 90H688" stroke="#dce5ed"/><text x="32" y="40" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="27" fill="#102b44" font-weight="600" text-anchor="start">材料究竟在哪道工序消耗？</text><text x="32" y="69" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#526b80" font-weight="400" text-anchor="start">按功能分组 · 卡片之间不表示连续的工艺顺序</text><rect x="32" y="116" width="312" height="92" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="32" y="116" width="5" height="92" rx="2" fill="#3264c8" stroke="#3264c8"/><text x="50" y="151" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">硅片 / 衬底</text><text x="50" y="182" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">作为器件加工基础</text><rect x="376" y="116" width="312" height="92" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="376" y="116" width="5" height="92" rx="2" fill="#137b87" stroke="#137b87"/><text x="394" y="151" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="start">光刻胶及配套液</text><text x="394" y="182" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">曝光显影形成图案</text><rect x="32" y="238" width="312" height="92" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="32" y="238" width="5" height="92" rx="2" fill="#3264c8" stroke="#3264c8"/><text x="50" y="273" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">特气 / 前驱体 / 靶材</text><text x="50" y="304" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">按工艺形成或加工薄膜</text><rect x="376" y="238" width="312" height="92" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="376" y="238" width="5" height="92" rx="2" fill="#137b87" stroke="#137b87"/><text x="394" y="273" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="start">湿化学品 / CMP</text><text x="394" y="304" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">清洗、平坦化与缺陷控制</text><rect x="32" y="360" width="312" height="92" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="32" y="360" width="5" height="92" rx="2" fill="#3264c8" stroke="#3264c8"/><text x="50" y="395" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">封装材料</text><text x="50" y="426" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">连接、保护与热管理</text><rect x="376" y="360" width="312" height="92" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="376" y="360" width="5" height="92" rx="2" fill="#137b87" stroke="#137b87"/><text x="394" y="395" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="start">客户产线认证</text><text x="394" y="426" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">批次一致性与稳定复购</text><rect x="32" y="511" width="656" height="47" rx="8" fill="#edf3f8" stroke="#edf3f8"/><text x="47" y="535" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">材料用量跟实际加工和配方走；设备采购额不能直接推算材料收入。</text></svg>