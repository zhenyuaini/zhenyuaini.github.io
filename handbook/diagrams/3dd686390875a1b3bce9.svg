<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620" role="img" aria-labelledby="title desc"><title id="title">机器人拿起水杯：动作必须形成反馈闭环</title><desc id="desc">感知、控制与执行的逻辑示意 · 非特定机器人硬件布局</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><rect width="720" height="620" rx="18" fill="#f7fafc"/><path d="M32 90H688" stroke="#dce5ed"/><text x="32" y="40" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="27" fill="#102b44" font-weight="600" text-anchor="start">机器人拿起水杯：动作必须形成反馈闭环</text><text x="32" y="69" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#526b80" font-weight="400" text-anchor="start">感知、控制与执行的逻辑示意 · 非特定机器人硬件布局</text><rect x="40" y="136" width="280" height="92" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="40" y="136" width="5" height="92" rx="2" fill="#3264c8" stroke="#3264c8"/><text x="58" y="171" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">感知</text><text x="58" y="202" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">视觉 / 位置 / 力觉</text><rect x="400" y="136" width="280" height="92" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="400" y="136" width="5" height="92" rx="2" fill="#137b87" stroke="#137b87"/><text x="418" y="171" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="start">控制与规划</text><text x="418" y="202" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">计算目标动作与误差</text><rect x="400" y="328" width="280" height="92" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="400" y="328" width="5" height="92" rx="2" fill="#b58438" stroke="#b58438"/><text x="418" y="363" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#b58438" font-weight="600" text-anchor="start">驱动与执行</text><text x="418" y="394" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">电机 / 适用的传动件</text><rect x="40" y="328" width="280" height="92" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="40" y="328" width="5" height="92" rx="2" fill="#3264c8" stroke="#3264c8"/><text x="58" y="363" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">实际动作</text><text x="58" y="394" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">夹持力度、位置与接触</text><path d="M328 181 L390 181" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><path d="M540 235 L540 318" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><path d="M390 373 L330 373" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><path d="M180 318 L180 235" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><text x="360" y="493" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="25" fill="#102b44" font-weight="600" text-anchor="middle">读到误差 → 调整动作 → 再次测量</text><rect x="32" y="514" width="656" height="74" rx="8" fill="#edf3f8" stroke="#edf3f8"/><text x="47" y="538" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">减速器改变转速与扭矩，丝杠可把旋转变为直线运动。</text><text x="47" y="565" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">不同关节不一定同时采用二者；一次演示不能证明连续稳定运行。</text></svg>