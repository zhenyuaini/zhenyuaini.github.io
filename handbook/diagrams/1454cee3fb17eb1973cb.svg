<svg xmlns="http://www.w3.org/2000/svg" width="720" height="539" viewBox="0 0 720 539" role="img" aria-labelledby="title desc"><title id="title">AI 需求怎样变成可交付收入？</title><desc id="desc">沿客户付费、项目回报和交付条件向下验证</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><rect width="720" height="539" rx="18" fill="#f7fafc"/><path d="M32 90H688" stroke="#dce5ed"/><text x="32" y="40" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="27" fill="#102b44" font-weight="600" text-anchor="start">AI 需求怎样变成可交付收入？</text><text x="32" y="69" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#526b80" font-weight="400" text-anchor="start">沿客户付费、项目回报和交付条件向下验证</text><rect x="32" y="115" width="656" height="85" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="32" y="115" width="5" height="85" rx="2" fill="#3264c8" stroke="#3264c8"/><text x="50" y="150" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">需求</text><text x="50" y="181" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">实际付费、重复使用、续约</text><path d="M360 203 L360 217" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="220" width="656" height="85" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="32" y="220" width="5" height="85" rx="2" fill="#3264c8" stroke="#3264c8"/><text x="50" y="255" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">回报与政策</text><text x="50" y="286" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">资本成本、许可范围、生效日期</text><path d="M360 308 L360 322" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="325" width="656" height="85" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="32" y="325" width="5" height="85" rx="2" fill="#137b87" stroke="#137b87"/><text x="50" y="360" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="start">有效交付</text><text x="50" y="391" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">通电、设备供应、验收、利用率</text><rect x="32" y="433" width="656" height="74" rx="8" fill="#edf3f8" stroke="#edf3f8"/><text x="47" y="457" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">将总需求缩到公司有认证且能在窗口交付的范围。</text><text x="47" y="484" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">最后从利润、回款与投入验证原有假设。</text></svg>