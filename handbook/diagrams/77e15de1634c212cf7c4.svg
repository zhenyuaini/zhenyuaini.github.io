<svg xmlns="http://www.w3.org/2000/svg" width="720" height="444" viewBox="0 0 720 444" role="img" aria-labelledby="title desc"><title id="title">更快的服务器，会不会堵在柜外？</title><desc id="desc">教学假设 · 同方向跨柜流量 · GB/s</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><rect width="720" height="444" rx="18" fill="#f7fafc"/><path d="M32 90H688" stroke="#dce5ed"/><text x="32" y="40" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="27" fill="#102b44" font-weight="600" text-anchor="start">更快的服务器，会不会堵在柜外？</text><text x="32" y="69" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#526b80" font-weight="400" text-anchor="start">教学假设 · 同方向跨柜流量 · GB/s</text><text x="36" y="135" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" fill="#102b44" font-weight="650" text-anchor="start">旧机 · 8 台 × 1 GB/s</text><rect x="36" y="151" width="240" height="26" rx="5" fill="#3264c8" stroke="#3264c8"/><text x="292" y="172" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" fill="#3264c8" font-weight="650" text-anchor="start">8</text><text x="36" y="227" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" fill="#102b44" font-weight="650" text-anchor="start">新机 · 8 台 × 2 GB/s</text><rect x="36" y="243" width="480" height="26" rx="5" fill="#137b87" stroke="#137b87"/><text x="532" y="264" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" fill="#137b87" font-weight="650" text-anchor="start">16</text><path d="M276 148 L276 309" fill="none" stroke="#b58438" stroke-width="2" stroke-dasharray="6 5"/><text x="276" y="342" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#102b44" font-weight="400" text-anchor="middle">柜外通道上限 8 GB/s</text><rect x="32" y="365" width="656" height="47" rx="8" fill="#edf3f8" stroke="#edf3