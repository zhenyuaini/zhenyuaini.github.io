<svg xmlns="http://www.w3.org/2000/svg" width="720" height="434" viewBox="0 0 720 434" role="img" aria-labelledby="title desc"><title id="title">只换一端，少买多少可插拔？</title><desc id="desc">教学假设 · 两期均为 100 条光链路</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><rect width="720" height="434" rx="18" fill="#f7fafc"/><path d="M32 90H688" stroke="#dce5ed"/><text x="32" y="40" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="27" fill="#102b44" font-weight="600" text-anchor="start">只换一端，少买多少可插拔？</text><text x="32" y="69" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#526b80" font-weight="400" text-anchor="start">教学假设 · 两期均为 100 条光链路</text><rect x="32" y="113" width="319" height="224" rx="10" fill="#fff" stroke="#d3e0ea"/><text x="52" y="149" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="23" fill="#3264c8" font-weight="650" text-anchor="start">两端均可插拔</text><text x="52" y="189" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#526b80" font-weight="400" text-anchor="start">交换机侧可插拔</text><text x="331" y="189" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" fill="#102b44" font-weight="650" text-anchor="end">100 只</text><text x="52" y="226" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#526b80" font-weight="400" text-anchor="start">对端可插拔</text><text x="331" y="226" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" fill="#102b44" font-weight="650" text-anchor="end">100 只</text><text x="52" y="263" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#526b80" font-weight="400" text-anchor="start">共封装光端口</text><text x="331" y="263" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" fill="#102b44" font-weight="650" text-anchor="end">0 个</text><rect x="369" y="113" width="319" height="224" rx="10" fill="#fff" stroke="#d3e0ea"/><text x="389" y="149" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="23" fill="#137b87" font-weight="650" text-anchor="start">交换机侧部分换代</text><text x="389" y="189" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#526b80" font-weight="400" text-anchor="start">交换机侧可插拔</text><text x="668" y="189" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" fill="#102b44" font-weight="650" text-anchor="end">40 只</text><text x="389" y="226" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#526b80" font-weight="400" text-anchor="start">对端可插拔</text><text x="668" y="226" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" fill="#102b44" font-weight="650" text-anchor="end">100 只</text><text x="389" y="263" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#526b80" font-weight="400" text-anchor="start">共封装光端口</text><text x="668" y="263" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" fill="#102b44" font-weight="650" text-anchor="end">60 个</text><rect x="32" y="355" width="656" height="47" rx="8" fill="#edf3f8" stroke="#edf3f8"/><text x="47" y="379" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">可插拔从 200 只到 140 只。光端口数与光引擎数分别统计。</text></svg>