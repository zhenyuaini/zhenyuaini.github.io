text-anchor="start">端头 B</text><text x="360" y="475" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="25" fill="#102b44" font-weight="600" text-anchor="middle">电极之间隔着陶瓷介质</text><rect x="32" y="504" width="656" height="74" rx="8" fill="#edf3f8" stroke="#edf3f8"/><text x="47" y="528" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">相邻电极不直接接触；有效电容量还受材料和工作条件影响。</text><text x="47" y="555" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">服务器去耦看实际电压、温度、频段和板位，不能只比较标称容值。</text></svg>