<svg xmlns="http://www.w3.org/2000/svg" width="720" height="598" viewBox="0 0 720 598" role="img" aria-labelledby="title desc"><title id="title">从送样到入账，还要核对哪些证据？</title><desc id="desc">风华高科 MLCC 案例 · 顺序用于判断披露证据，不代表该批产品进度</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><rect width="720" height="598" rx="18" fill="#f7fafc"/><path d="M32 90H688" stroke="#dce5ed"/><text x="32" y="40" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="27" fill="#102b44" font-weight="600" text-anchor="start">从送样到入账，还要核对哪些证据？</text><text x="32" y="69" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#526b80" font-weight="400" text-anchor="start">风华高科 MLCC 案例 · 顺序用于判断披露证据，不代表该批产品进度</text><rect x="32" y="116" width="656" height="84" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="32" y="116" width="5" height="84" rx="2" fill="#b58438" stroke="#b58438"/><text x="50" y="151" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#b58438" font-weight="600" text-anchor="start">送样 / 抗老化</text><text x="50" y="182" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">核对具体料号和测试结果。本次问答未披露。</text><path d="M360 201 L360 212" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="215" width="656" height="84" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="32" y="215" width="5" height="84" rx="2" fill="#3264c8" stroke="#3264c8"/><text x="50" y="250" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">客户认证</text><text x="50" y="281" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">公司答复为新品陆续获认证。该批状态未披露。</text><path d="M360 300 L360 311" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="314" width="656" height="84" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="32" y="314" width="5" height="84" rx="2" fill="#b58438" stroke="#b58438"/><text x="50" y="349" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#b58438" font-weight="600" text-anchor="start">采购 / 交付</text><text x="50" y="380" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">核对订单、提货和重复采购。该批均未披露。</text><path d="M360 399 L360 410" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="413" width="656" height="84" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="32" y="413" width="5" height="84" rx="2" fill="#b58438" stroke="#b58438"/><text x="50" y="448" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#b58438" font-weight="600" text-anchor="start">收入确认</text><text x="50" y="479" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">核对交付与会计口径。服务器料号未单列。</text><rect x="32" y="519" width="656" height="47" rx="8" fill="#edf3f8" stroke="#edf3f8"/><text x="47" y="543" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">5.6 亿元为两层占比粗算的全部高端 MLCC，服务器收入无法从中单拆。</text></svg>