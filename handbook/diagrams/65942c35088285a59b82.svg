<svg xmlns="http://www.w3.org/2000/svg" width="720" height="545" viewBox="0 0 720 545" role="img" aria-labelledby="title desc"><title id="title">相同缺货信号，可能是两条路</title><desc id="desc">研究示意 · 追实际消耗、合格产出和交期</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><rect width="720" height="545" rx="18" fill="#f7fafc"/><path d="M32 90H688" stroke="#dce5ed"/><text x="32" y="40" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="27" fill="#102b44" font-weight="600" text-anchor="start">相同缺货信号，可能是两条路</text><text x="32" y="69" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#526b80" font-weight="400" text-anchor="start">研究示意 · 追实际消耗、合格产出和交期</text><rect x="32" y="117" width="314" height="86" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="32" y="117" width="5" height="86" rx="2" fill="#3264c8" stroke="#3264c8"/><text x="50" y="152" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">短期错配</text><text x="50" y="183" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">先核实际消耗与渠道库存</text><rect x="373" y="117" width="315" height="86" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="373" y="117" width="5" height="86" rx="2" fill="#137b87" stroke="#137b87"/><text x="391" y="152" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="start">长期瓶颈</text><text x="391" y="183" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">先找受限规格和认证工序</text><rect x="32" y="234" width="314" height="86" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="32" y="234" width="5" height="86" rx="2" fill="#3264c8" stroke="#3264c8"/><text x="50" y="269" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">若补货后交期恢复</text><text x="50" y="300" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">检查重复采购是否回落</text><rect x="373" y="234" width="315" height="86" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="373" y="234" width="5" height="86" rx="2" fill="#137b87" stroke="#137b87"/><text x="391" y="269" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="start">若数季仍有缺口</text><text x="391" y="300" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">跟踪扩产、良率与交付</text><path d="M188 205 L188 230" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><path d="M529 205 L529 230" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><text x="36" y="367" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" fill="#102b44" font-weight="650" text-anchor="start">共同验证：终端消耗、实际提货与价格是否同向</text><rect x="32" y="439" width="656" height="74" rx="8" fill="#edf3f8" stroke="#edf3f8"/><text x="47" y="463" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">交期变短时，先分清是供给恢复，还是终端订单转弱。</text><text x="47" y="490" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">观察窗口用产品的生产、认证和交付周期确定。</text></svg>