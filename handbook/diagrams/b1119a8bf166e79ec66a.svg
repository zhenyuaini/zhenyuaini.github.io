<svg xmlns="http://www.w3.org/2000/svg" width="720" height="630" viewBox="0 0 720 630" role="img" aria-labelledby="title desc"><title id="title">紧缺到过剩：四种供需状态</title><desc id="desc">观察框架 · 不代表固定时间顺序或机械买卖信号</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><rect width="720" height="630" rx="18" fill="#f7fafc"/><path d="M32 90H688" stroke="#dce5ed"/><text x="32" y="40" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="27" fill="#102b44" font-weight="600" text-anchor="start">紧缺到过剩：四种供需状态</text><text x="32" y="69" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#526b80" font-weight="400" text-anchor="start">观察框架 · 不代表固定时间顺序或机械买卖信号</text><rect x="35" y="130" width="296" height="115" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="35" y="130" width="5" height="115" rx="2" fill="#3264c8" stroke="#3264c8"/><text x="53" y="165" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">需求加速 / 供给滞后</text><text x="53" y="196" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">交期与价格是否改善？</text><rect x="389" y="130" width="296" height="115" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="389" y="130" width="5" height="115" rx="2" fill="#137b87" stroke="#137b87"/><text x="407" y="165" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="start">需求仍强 / 供给追赶</text><text x="407" y="196" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">合格产能何时落地？</text><rect x="389" y="322" width="296" height="115" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="389" y="322" width="5" height="115" rx="2" fill="#b58438" stroke="#b58438"/><text x="407" y="357" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#b58438" font-weight="600" text-anchor="start">需求放缓 / 库存上升</text><text x="407" y="388" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">终端还是提前囤货？</text><rect x="35" y="322" width="296" height="115" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="35" y="322" width="5" height="115" rx="2" fill="#526b80" stroke="#526b80"/><text x="53" y="357" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#526b80" font-weight="600" text-anchor="start">库存去化 / 扩产收缩</text><text x="53" y="388" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">需求是否真正企稳？</text><path d="M337 185 L380 185" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><path d="M537 252 L537 313" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><path d="M380 380 L340 380" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><path d="M181 313 L181 253" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="524" width="656" height="74" rx="8" fill="#edf3f8" stroke="#edf3f8"/><text x="47" y="548" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">同时记录具体规格、日期、价格、库存与合格供给；未知值留空。</text><text x="47" y="575" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">循环只是研究线索，产品结构、技术替代与客户认证可改变路径。</text></svg>