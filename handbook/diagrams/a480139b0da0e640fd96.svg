<svg xmlns="http://www.w3.org/2000/svg" width="720" height="670" viewBox="0 0 720 670" role="img" aria-labelledby="title desc"><title id="title">GPU 还是自研：先比较什么？</title><desc id="desc">判断框架 · 不把某一任务的结果外推所有模型</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><rect width="720" height="670" rx="18" fill="#f7fafc"/><path d="M32 90H688" stroke="#dce5ed"/><text x="32" y="40" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="27" fill="#102b44" font-weight="600" text-anchor="start">GPU 还是自研：先比较什么？</text><text x="32" y="69" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#526b80" font-weight="400" text-anchor="start">判断框架 · 不把某一任务的结果外推所有模型</text><rect x="32" y="117" width="656" height="88" rx="10" fill="#fff" stroke="#d3e0ea"/><text x="48" y="150" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">软件与模型</text><text x="48" y="182" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#526b80" font-weight="400" text-anchor="start">新算子、频繁变更、开发迁移</text><text x="667" y="151" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="end">适配成本</text><rect x="32" y="222" width="656" height="88" rx="10" fill="#fff" stroke="#d3e0ea"/><text x="48" y="255" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">实际工作负载</text><text x="48" y="287" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#526b80" font-weight="400" text-anchor="start">同质量、同延迟的有效吞吐</text><text x="667" y="256" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="end">任务成本</text><rect x="32" y="327" width="656" height="88" rx="10" fill="#fff" stroke="#d3e0ea"/><text x="48" y="360" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">容量与交付</text><text x="48" y="392" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#526b80" font-weight="400" text-anchor="start">利用率、峰值冗余、可用产能</text><text x="667" y="361" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="end">设备缺口</text><rect x="32" y="432" width="656" height="88" rx="10" fill="#fff" stroke="#d3e0ea"/><text x="48" y="465" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">客户采用</text><text x="48" y="497" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#526b80" font-weight="400" text-anchor="start">生产部署、第二个模型与复购</text><text x="667" y="466" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="end">持续需求</text><rect x="32" y="591" width="656" height="47" rx="8" fill="#edf3f8" stroke="#edf3f8"/><text x="47" y="615" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">单次基准跑分解决性能问题，不能直接证明迁移经济性。</text></svg>