<svg xmlns="http://www.w3.org/2000/svg" width="720" height="434" viewBox="0 0 720 434" role="img" aria-labelledby="title desc"><title id="title">需要两倍存储，磁盘数量怎么变？</title><desc id="desc">教学假设 · 100 台服务器 · 每台两块盘</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><rect width="720" height="434" rx="18" fill="#f7fafc"/><path d="M32 90H688" stroke="#dce5ed"/><text x="32" y="40" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="27" fill="#102b44" font-weight="600" text-anchor="start">需要两倍存储，磁盘数量怎么变？</text><text x="32" y="69" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#526b80" font-weight="400" text-anchor="start">教学假设 · 100 台服务器 · 每台两块盘</text><rect x="32" y="113" width="319" height="224" rx="10" fill="#fff" stroke="#d3e0ea"/><text x="52" y="149" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="23" fill="#3264c8" font-weight="650" text-anchor="start">原配置</text><text x="52" y="189" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#526b80" font-weight="400" text-anchor="start">整批容量</text><text x="331" y="189" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" fill="#102b44" font-weight="650" text-anchor="end">800 TB</text><text x="52" y="226" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#526b80" font-weight="400" text-anchor="start">单盘容量</text><text x="331" y="226" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" fill="#102b44" font-weight="650" text-anchor="end">4 TB</text><text x="52" y="263" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#526b80" font-weight="400" text-anchor="start">SSD 数量</text><text x="331" y="263" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" fill="#102b44" font-weight="650" text-anchor="