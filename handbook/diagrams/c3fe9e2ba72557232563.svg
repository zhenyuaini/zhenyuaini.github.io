<svg xmlns="http://www.w3.org/2000/svg" width="720" height="650" viewBox="0 0 720 650" role="img" aria-labelledby="title desc"><title id="title">2D、2.5D、3D：连接位置有什么不同？</title><desc id="desc">结构原理示意 · 不代表任何一家厂商的标准产品</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><rect width="720" height="650" rx="18" fill="#f7fafc"/><path d="M32 90H688" stroke="#dce5ed"/><text x="32" y="40" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="27" fill="#102b44" font-weight="600" text-anchor="start">2D、2.5D、3D：连接位置有什么不同？</text><text x="32" y="69" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#526b80" font-weight="400" text-anchor="start">结构原理示意 · 不代表任何一家厂商的标准产品</text><text x="32" y="143" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#102b44" font-weight="600" text-anchor="start">2D｜同层封装</text><text x="32" y="173" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#526b80" font-weight="400" text-anchor="start">多个裸片连接到封装基板</text><rect x="383" y="202" width="290" height="20" rx="2" fill="#c6d9ce" stroke="#137b87"/><rect x="407" y="147" width="98" height="32" rx="3" fill="#dce6ff" stroke="#3264c8"/><rect x="548" y="147" width="98" height="32" rx="3" fill="#dce6ff" stroke="#3264c8"/><path d="M432 180 L432 200" fill="none" stroke="#b58438" stroke-width="3"/><path d="M574 180 L574 200" fill="none" stroke="#b58438" stroke-width="3"/><text x="32" y="290" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#102b44" font-weight="600" text-anchor="start">2.5D｜横向高密度互连</text><text x="32" y="320" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#526b80" font-weight="400" text-anchor="start">裸片并排，借助中介结构连接</text><rect x="383" y="349" width="290" height="20" rx="2" fill="#c6d9ce" stroke="#137b87"/><rect x="407" y="294" width="98" height="32" rx="3" fill="#dce6ff" stroke="#3264c8"/><rect x="548" y="294" width="98" height="32" rx="3" fill="#dce6ff" stroke="#3264c8"/><rect x="397" y="331" width="263" height="11" rx="2" fill="#c9dbe6" stroke="#137b87"/><path d="M432 327 L432 347" fill="none" stroke="#b58438" stroke-width="3"/><path d="M574 327 L574 347" fill="none" stroke="#b58438" stroke-width="3"/><text x="32" y="437" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#102b44" font-weight="600" text-anchor="start">3D｜芯片垂直堆叠</text><text x="32" y="467" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#526b80" font-weight="400" text-anchor="start">裸片上下连接，散热与测试更复杂</text><rect x="383" y="496" width="290" height="20" rx="2" fill="#c6d9ce" stroke="#137b87"/><rect x="460" y="427" width="134" height="17" rx="2" fill="#dce6ff" stroke="#3264c8"/><rect x="460" y="448" width="134" height="17" rx="2" fill="#dce6ff" stroke="#3264c8"/><rect x="460" y="469" width="134" height="17" rx="2" fill="#dce6ff" stroke="#3264c8"/><path d="M489 433 L489 493" fill="none" stroke="#b58438" stroke-width="3"/><path d="M562 433 L562 493" fill="none" stroke="#b58438" stroke-width="3"/><rect x="32" y="571" width="656" height="47" rx="8" fill="#edf3f8" stroke="#edf3f8"/><text x="47" y="595" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">分类帮助理解连接方式；真实工艺、材料与量产能力须看产品说明。</text></svg>