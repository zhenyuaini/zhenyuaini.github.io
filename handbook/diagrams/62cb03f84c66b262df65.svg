<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620" role="img" aria-labelledby="title desc"><title id="title">可插拔与 CPO：光引擎搬到了哪里？</title><desc id="desc">产品边界示意 · 不表示所有端口都会切换到同一种方案</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><rect width="720" height="620" rx="18" fill="#f7fafc"/><path d="M32 90H688" stroke="#dce5ed"/><text x="32" y="40" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="27" fill="#102b44" font-weight="600" text-anchor="start">可插拔与 CPO：光引擎搬到了哪里？</text><text x="32" y="69" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#526b80" font-weight="400" text-anchor="start">产品边界示意 · 不表示所有端口都会切换到同一种方案</text><text x="35" y="128" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="25" fill="#102b44" font-weight="600" text-anchor="start">可插拔</text><rect x="35" y="150" width="203" height="92" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="35" y="150" width="5" height="92" rx="2" fill="#3264c8" stroke="#3264c8"/><text x="53" y="185" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">交换芯片</text><text x="53" y="216" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">设备内部</text><rect x="302" y="150" width="203" height="92" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="302" y="150" width="5" height="92" rx="2" fill="#137b87" stroke="#137b87"/><text x="320" y="185" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="start">光学转换</text><text x="320" y="216" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">光引擎</text><path d="M244 196 L293 196" fill="none" stroke="#b58438" stroke-width="3" marker-end="url(#arrow)"/><path d="M513 196 L666 196" fill="none" stroke="#137b87" stroke-width="4" marker-end="url(#arrow)"/><text x="569" y="177" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" fill="#137b87" font-weight="400" text-anchor="start">光纤</text><rect x="24" y="141" width="228" height="113" rx="9" fill="none" stroke="#91a5b8"/><text x="302" y="273" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" fill="#526b80" font-weight="400" text-anchor="start">面板侧独立模块</text><text x="35" y="339" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="25" fill="#102b44" font-weight="600" text-anchor="start">CPO</text><rect x="35" y="361" width="203" height="92" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="35" y="361" width="5" height="92" rx="2" fill="#3264c8" stroke="#3264c8"/><text x="53" y="396" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">交换芯片</text><text x="53" y="427" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">设备内部</text><rect x="302" y="361" width="203" height="92" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="302" y="361" width="5" height="92" rx="2" fill="#137b87" stroke="#137b87"/><text x="320" y="396" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="start">光学转换</text><text x="320" y="427" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">光引擎</text><path d="M244 407 L293 407" fill="none" stroke="#b58438" stroke-width="3" marker-end="url(#arrow)"/><path d="M513 407 L666 407" fill="none" stroke="#137b87" stroke-width="4" marker-end="url(#arrow)"/><text x="569" y="388" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" fill="#137b87" font-weight="400" text-anchor="start">光纤</text><rect x="24" y="352" width="493" height="113" rx="9" fill="none" stroke="#91a5b8"/><text x="35" y="484" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" fill="#526b80" font-weight="400" text-anchor="start">同一封装区域内，缩短高速电连接</text><rect x="32" y="514" width="656" height="74" rx="8" fill="#edf3f8" stroke="#edf3f8"/><text x="47" y="538" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">CPO 改变部分接口的交付边界；另一端仍可能使用可插拔模块。</text><text x="47" y="565" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">外部激光源、光纤连接、维护方式和系统良率需要分别核对。</text></svg>