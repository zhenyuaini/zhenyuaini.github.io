<svg xmlns="http://www.w3.org/2000/svg" width="720" height="650" viewBox="0 0 720 650" role="img" aria-labelledby="title desc"><title id="title">资本开支怎么变成下一张采购单？</title><desc id="desc">传导机制示意 · 公司指引、合同承诺和实际支出分开记录</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><rect width="720" height="650" rx="18" fill="#f7fafc"/><path d="M32 90H688" stroke="#dce5ed"/><text x="32" y="40" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="27" fill="#102b44" font-weight="600" text-anchor="start">资本开支怎么变成下一张采购单？</text><text x="32" y="69" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#526b80" font-weight="400" text-anchor="start">传导机制示意 · 公司指引、合同承诺和实际支出分开记录</text><rect x="40" y="127" width="280" height="92" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="40" y="127" width="5" height="92" rx="2" fill="#3264c8" stroke="#3264c8"/><text x="58" y="162" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">客户付费与续约</text><text x="58" y="193" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">有效任务 / 可持续收入</text><rect x="400" y="127" width="280" height="92" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="400" y="127" width="5" height="92" rx="2" fill="#b58438" stroke="#b58438"/><text x="418" y="162" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#b58438" font-weight="600" text-anchor="start">资金与回报约束</text><text x="418" y="193" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">经营现金 / 融资 / 收益</text><path d="M180 228 L298 288" fill="none" stroke="#3264c8" stroke-width="2" marker-end="url(#arrow)"/><path d="M540 228 L425 288" fill="none" stroke="#b58438" stroke-width="2" marker-end="url(#arrow)"/><rect x="205" y="297" width="310" height="100" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="205" y="297" width="5" height="100" rx="2" fill="#137b87" stroke="#137b87"/><text x="223" y="332" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="start">下一期预算与采购</text><text x="223" y="363" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">指引 → 合同 → 实际交付</text><path d="M360 405 L360 444" fill="none" stroke="#137b87" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="453" width="640" height="88" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="40" y="453" width="5" height="88" rx="2" fill="#3264c8" stroke="#3264c8"/><text x="58" y="488" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">供应商兑现</text><text x="58" y="519" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">交付 → 收入 / 毛利 → 回款 → 追加订单</text><rect x="32" y="544" width="656" height="74" rx="8" fill="#edf3f8" stroke="#edf3f8"/><text x="47" y="568" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">利率变化先影响融资与预算条件，不能单独证明全行业订单取消。</text><text x="47" y="595" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">同一项目的租赁、园区建设与设备采购需要排除重复计算。</text></svg>