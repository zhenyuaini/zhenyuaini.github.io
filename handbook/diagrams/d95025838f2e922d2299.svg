<svg xmlns="http://www.w3.org/2000/svg" width="720" height="546" viewBox="0 0 720 546" role="img" aria-labelledby="title desc"><title id="title">从任务出发估加速器需求</title><desc id="desc">按同一模型、精度和服务等级比较</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><rect width="720" height="546" rx="18" fill="#f7fafc"/><path d="M32 90H688" stroke="#dce5ed"/><text x="32" y="40" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="27" fill="#102b44" font-weight="600" text-anchor="start">从任务出发估加速器需求</text><text x="32" y="69" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#526b80" font-weight="400" text-anchor="start">按同一模型、精度和服务等级比较</text><rect x="32" y="116" width="656" height="85" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="32" y="116" width="5" height="85" rx="2" fill="#3264c8" stroke="#3264c8"/><text x="50" y="151" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">付费任务</text><text x="50" y="182" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">分训练、批量推理和低延迟推理</text><path d="M360 201 L360 221" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="224" width="656" height="85" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="32" y="224" width="5" height="85" rx="2" fill="#3264c8" stroke="#3264c8"/><text x="50" y="259" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#3264c8" font-weight="600" text-anchor="start">每张卡的有效产出</text><text x="50" y="290" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">同负载比较吞吐、延迟和利用率</text><path d="M360 309 L360 329" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="332" width="656" height="85" rx="10" fill="#fff" stroke="#d3e0ea"/><rect x="32" y="332" width="5" height="85" rx="2" fill="#137b87" stroke="#137b87"/><text x="50" y="367" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" fill="#137b87" font-weight="600" text-anchor="start">可交付的整柜</text><text x="50" y="398" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">对照 HBM、网络、通电与软件迁移</text><rect x="32" y="440" width="656" height="74" rx="8" fill="#edf3f8" stroke="#edf3f8"/><text x="47" y="464" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">同等服务水平下，需求与单卡效率可能同时提高。</text><text x="47" y="491" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#526b80" font-weight="400" text-anchor="start">定制芯片的合格负载和对外销售范围单列。</text></svg>